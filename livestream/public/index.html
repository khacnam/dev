<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream App - Đăng nhập</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .tab-buttons {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }

    .tab-button {
      flex: 1;
      padding: 15px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #666;
      transition: all 0.3s;
    }

    .tab-button.active {
      color: #667eea;
      border-bottom: 3px solid #667eea;
      margin-bottom: -2px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 5px;
      font-size: 14px;
      transition: border 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
    }

    .message {
      padding: 12px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
    }

    .message.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .message.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .message.show {
      display: block;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 5px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎥 Live Stream App</h1>

    <div class="message" id="message"></div>

    <div class="tab-buttons">
      <button class="tab-button active" onclick="switchTab('login')">Đăng nhập</button>
      <button class="tab-button" onclick="switchTab('register')">Đăng ký</button>
    </div>

    <div id="login" class="tab-content active">
      <form id="loginForm">
        <div class="form-group">
          <label for="login-username">Tên đăng nhập</label>
          <input type="text" id="login-username" required>
        </div>
        <div class="form-group">
          <label for="login-password">Mật khẩu</label>
          <input type="password" id="login-password" required>
        </div>
        <button type="submit">Đăng nhập</button>
      </form>
    </div>

    <div id="register" class="tab-content">
      <form id="registerForm">
        <div class="form-group">
          <label for="register-username">Tên đăng nhập</label>
          <input type="text" id="register-username" required>
        </div>
        <div class="form-group">
          <label for="register-email">Email (tùy chọn)</label>
          <input type="email" id="register-email">
        </div>
        <div class="form-group">
          <label for="register-password">Mật khẩu</label>
          <input type="password" id="register-password" required>
        </div>
        <div class="form-group">
          <label for="register-password2">Xác nhận mật khẩu</label>
          <input type="password" id="register-password2" required>
        </div>
        <button type="submit">Đăng ký</button>
      </form>
    </div>

    <div class="info">
      <strong>Hướng dẫn:</strong><br>
      1. Đăng ký tài khoản mới hoặc đăng nhập<br>
      2. Nhận Stream Key và URL riêng của bạn<br>
      3. Sử dụng OBS hoặc app di động để phát trực tiếp<br>
      4. Chia sẻ link để người khác xem stream
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tab).classList.add('active');
      hideMessage();
    }

    function showMessage(text, type) {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = `message ${type} show`;
    }

    function hideMessage() {
      document.getElementById('message').className = 'message';
    }

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          showMessage('Đăng nhập thành công!', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 1000);
        } else {
          showMessage(data.error || 'Đăng nhập thất bại', 'error');
        }
      } catch (error) {
        showMessage('Lỗi kết nối đến server', 'error');
      }
    });

    // Register form
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const password2 = document.getElementById('register-password2').value;

      if (password !== password2) {
        showMessage('Mật khẩu xác nhận không khớp', 'error');
        return;
      }

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, email })
        });

        const data = await response.json();

        if (response.ok) {
          showMessage('Đăng ký thành công! Vui lòng đăng nhập', 'success');
          setTimeout(() => {
            switchTab('login');
            document.getElementById('login-username').value = username;
          }, 1500);
        } else {
          showMessage(data.error || 'Đăng ký thất bại', 'error');
        }
      } catch (error) {
        showMessage('Lỗi kết nối đến server', 'error');
      }
    });

    // Check if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard';
    }
  </script>
</body>
</html>
