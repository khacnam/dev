<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem Live Stream</title>
  <link href="https://cdn.jsdelivr.net/npm/video.js@7.20.3/dist/video-js.min.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f0f;
      color: white;
      overflow-x: hidden;
    }

    .header {
      background: rgba(0, 0, 0, 0.9);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #667eea;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
    }

    .nav-link {
      padding: 8px 15px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s;
      font-size: 14px;
    }

    .nav-link:hover {
      background: #5568d3;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      max-width: 1600px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .video-section {
      min-width: 0;
    }

    .video-container {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    .video-js {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
    }

    .stream-info {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .stream-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .status-badge.live {
      background: #ff0000;
      color: white;
      animation: pulse 2s infinite;
    }

    .status-badge.offline {
      background: #6c757d;
      color: white;
    }

    .viewer-count {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 14px;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .stream-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .stream-streamer {
      color: #aaa;
      font-size: 14px;
    }

    .stream-description {
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
      margin-top: 10px;
    }

    /* Chat Section */
    .chat-section {
      background: #1a1a1a;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 140px);
      position: sticky;
      top: 90px;
    }

    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #333;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 8px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    .chat-message {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      word-wrap: break-word;
    }

    .chat-username {
      font-weight: 600;
      color: #667eea;
      margin-right: 8px;
    }

    .chat-text {
      color: #ddd;
    }

    .chat-timestamp {
      font-size: 11px;
      color: #888;
      margin-left: 8px;
    }

    .chat-input-container {
      padding: 15px;
      border-top: 1px solid #333;
    }

    .chat-input-wrapper {
      display: flex;
      gap: 10px;
    }

    .username-input {
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 5px;
      color: white;
      font-size: 14px;
      width: 120px;
    }

    .username-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .chat-input {
      flex: 1;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 5px;
      color: white;
      font-size: 14px;
    }

    .chat-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .send-btn {
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }

    .send-btn:hover {
      background: #5568d3;
    }

    .send-btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    .share-section {
      background: rgba(33, 150, 243, 0.1);
      border: 2px solid #2196F3;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .share-section h3 {
      color: #2196F3;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .share-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .share-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
      font-size: 13px;
    }

    .share-btn.copy {
      background: #28a745;
      color: white;
    }

    .share-btn.facebook {
      background: #1877f2;
      color: white;
    }

    .share-btn.twitter {
      background: #1da1f2;
      color: white;
    }

    .share-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .loading {
      text-align: center;
      padding: 100px 20px;
    }

    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-message {
      background: rgba(220, 53, 69, 0.2);
      border: 2px solid #dc3545;
      color: white;
      padding: 20px;
      border-radius: 10px;
      margin: 20px;
      text-align: center;
    }

    @media (max-width: 1024px) {
      .main-container {
        grid-template-columns: 1fr;
      }

      .chat-section {
        height: 400px;
        position: relative;
        top: 0;
      }
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 10px;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
      }

      .username-input {
        width: 80px;
      }

      .share-buttons {
        flex-direction: column;
      }

      .share-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎥 Live Stream</h1>
    <div class="nav-links">
      <a href="/" class="nav-link">Trang chủ</a>
      <a href="/browse" class="nav-link">Duyệt</a>
      <a href="/dashboard" class="nav-link">Dashboard</a>
    </div>
  </div>

  <div id="loadingSection" class="loading">
    <div class="loading-spinner"></div>
    <p>Đang tải stream...</p>
  </div>

  <div id="errorSection" style="display: none;">
    <div class="error-message">
      <h2>❌ Không thể tải stream</h2>
      <p id="errorMessage">Stream không tồn tại hoặc đã kết thúc.</p>
      <p style="margin-top: 15px;">
        <a href="/browse" class="nav-link">Duyệt streams</a>
      </p>
    </div>
  </div>

  <div id="mainContent" class="main-container" style="display: none;">
    <!-- Video Section -->
    <div class="video-section">
      <div class="video-container">
        <video
          id="videoPlayer"
          class="video-js vjs-default-skin vjs-big-play-centered"
          controls
          preload="auto"
          data-setup='{}'>
        </video>
      </div>

      <div class="stream-info">
        <div class="stream-header">
          <span class="status-badge" id="statusBadge">Checking...</span>
          <span class="viewer-count" id="viewerCount">👁️ 0 viewers</span>
        </div>
        <h2 class="stream-title" id="streamTitle">Live Stream</h2>
        <div class="stream-streamer" id="streamStreamer">👤 Streamer</div>
        <p class="stream-description" id="streamDescription"></p>
      </div>

      <div class="share-section">
        <h3>📤 Chia sẻ stream</h3>
        <div class="share-buttons">
          <button class="share-btn copy" onclick="copyLink()">📋 Copy Link</button>
          <button class="share-btn facebook" onclick="shareFacebook()">📘 Facebook</button>
          <button class="share-btn twitter" onclick="shareTwitter()">🐦 Twitter</button>
        </div>
      </div>
    </div>

    <!-- Chat Section -->
    <div class="chat-section">
      <div class="chat-header">💬 Live Chat</div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-message">
          <span class="chat-username">System</span>
          <span class="chat-text">Chào mừng đến với live chat!</span>
        </div>
      </div>
      <div class="chat-input-container">
        <div style="margin-bottom: 10px;">
          <input
            type="text"
            class="username-input"
            id="usernameInput"
            placeholder="Tên của bạn"
            maxlength="20"
          />
        </div>
        <div class="chat-input-wrapper">
          <input
            type="text"
            class="chat-input"
            id="chatInput"
            placeholder="Nhập tin nhắn..."
            maxlength="500"
          />
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">Gửi</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/video.js@7.20.3/dist/video.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const streamKey = window.location.pathname.split('/').pop();
    const domain = window.location.hostname;
    const httpPort = window.location.port || '3000';
    const streamUrl = `http://${domain}:8000/live/${streamKey}.m3u8`;

    let player;
    let socket;
    let statusCheckInterval;
    let username = localStorage.getItem('chatUsername') || '';

    if (username) {
      document.getElementById('usernameInput').value = username;
    }

    // Initialize Socket.IO
    socket = io();

    socket.on('connect', () => {
      console.log('Connected to socket');
      socket.emit('join-stream', streamKey);
    });

    socket.on('viewer-count', (count) => {
      document.getElementById('viewerCount').textContent = `👁️ ${count} viewers`;
    });

    socket.on('chat-message', (data) => {
      addChatMessage(data.username, data.message, data.timestamp);
    });

    socket.on('stream-ended', () => {
      showError('Stream đã kết thúc');
      const statusBadge = document.getElementById('statusBadge');
      statusBadge.textContent = 'Stream Ended';
      statusBadge.className = 'status-badge offline';
    });

    async function checkStreamStatus() {
      try {
        const response = await fetch(`/api/stream/${streamKey}/status`);
        const data = await response.json();

        const statusBadge = document.getElementById('statusBadge');

        if (data.isLive) {
          statusBadge.textContent = '🔴 LIVE';
          statusBadge.className = 'status-badge live';

          if (data.stream) {
            document.getElementById('streamTitle').textContent =
              data.stream.title || `Live Stream`;
            document.getElementById('streamStreamer').textContent =
              `👤 ${data.stream.username}`;
            document.getElementById('streamDescription').textContent =
              data.stream.description || 'Đang phát trực tiếp...';
          }

          return true;
        } else {
          statusBadge.textContent = 'Offline';
          statusBadge.className = 'status-badge offline';
          return false;
        }
      } catch (error) {
        console.error('Error checking stream status:', error);
        return false;
      }
    }

    async function initPlayer() {
      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('mainContent').style.display = 'grid';

      // Initialize video.js player
      player = videojs('videoPlayer', {
        autoplay: true,
        controls: true,
        fluid: true,
        liveui: true,
        sources: [{
          src: streamUrl,
          type: 'application/x-mpegURL'
        }]
      });

      player.on('error', function() {
        const error = player.error();
        console.error('Video.js error:', error);

        checkStreamStatus().then(isLive => {
          if (!isLive) {
            showError('Stream hiện không phát trực tiếp. Vui lòng thử lại sau.');
          }
        });
      });

      player.on('loadeddata', function() {
        console.log('Stream loaded successfully');
      });

      // Check status periodically
      statusCheckInterval = setInterval(checkStreamStatus, 10000);
    }

    function showError(message) {
      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('mainContent').style.display = 'none';
      document.getElementById('errorSection').style.display = 'block';
      document.getElementById('errorMessage').textContent = message;
    }

    // Chat functions
    function addChatMessage(username, message, timestamp) {
      const chatMessages = document.getElementById('chatMessages');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'chat-message';

      const time = timestamp ? new Date(timestamp).toLocaleTimeString('vi-VN', {
        hour: '2-digit',
        minute: '2-digit'
      }) : '';

      messageDiv.innerHTML = `
        <span class="chat-username">${escapeHtml(username)}:</span>
        <span class="chat-text">${escapeHtml(message)}</span>
        ${time ? `<span class="chat-timestamp">${time}</span>` : ''}
      `;

      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      // Limit messages
      while (chatMessages.children.length > 100) {
        chatMessages.removeChild(chatMessages.firstChild);
      }
    }

    function sendMessage() {
      const usernameInput = document.getElementById('usernameInput');
      const chatInput = document.getElementById('chatInput');
      const message = chatInput.value.trim();
      const username = usernameInput.value.trim() || 'Anonymous';

      if (!message) return;

      // Save username
      localStorage.setItem('chatUsername', username);

      // Send via socket
      socket.emit('chat-message', {
        streamKey,
        username,
        message
      });

      // Clear input
      chatInput.value = '';
    }

    // Enter to send
    document.getElementById('chatInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Share functions
    function copyLink() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        event.target.textContent = '✓ Đã copy!';
        setTimeout(() => {
          event.target.textContent = '📋 Copy Link';
        }, 2000);
      }).catch(err => {
        alert('Không thể copy. URL: ' + url);
      });
    }

    function shareFacebook() {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, '_blank');
    }

    function shareTwitter() {
      const url = encodeURIComponent(window.location.href);
      const text = encodeURIComponent('Đang xem live stream!');
      window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initialize
    async function init() {
      const isLive = await checkStreamStatus();

      if (isLive) {
        setTimeout(() => {
          initPlayer();
        }, 2000);
      } else {
        setTimeout(() => {
          initPlayer();
        }, 2000);

        const waitInterval = setInterval(async () => {
          const isNowLive = await checkStreamStatus();
          if (isNowLive && player) {
            clearInterval(waitInterval);
            player.src({
              src: streamUrl,
              type: 'application/x-mpegURL'
            });
            player.play();
          }
        }, 5000);
      }
    }

    // Cleanup
    window.addEventListener('beforeunload', () => {
      if (statusCheckInterval) {
        clearInterval(statusCheckInterval);
      }
      if (player) {
        player.dispose();
      }
      if (socket) {
        socket.emit('leave-stream', streamKey);
        socket.disconnect();
      }
    });

    // Start
    init();
  </script>
</body>
</html>
